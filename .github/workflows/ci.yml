name: Pre-commit & CI Quality Gates

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    working-directory: cdd-spec-conformance

jobs:
  # ---------------------------------------------------------------------------
  # Hook 1: pre-commit-hooks (trailing-whitespace, end-of-file-fixer,
  #         check-yaml, check-json, mixed-line-ending)
  # ---------------------------------------------------------------------------
  hook-pre-commit-file-checks:
    name: "Hook [1/8]: pre-commit-hooks (File Hygiene & Schemas)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python3 -m pip install --upgrade pip pre-commit

      - name: Run trailing-whitespace hook
        run: pre-commit run trailing-whitespace --all-files --verbose --show-diff-on-failure

      - name: Run end-of-file-fixer hook
        run: pre-commit run end-of-file-fixer --all-files --verbose --show-diff-on-failure

      - name: Run check-yaml hook
        run: pre-commit run check-yaml --all-files --verbose --show-diff-on-failure

      - name: Run check-json hook
        run: pre-commit run check-json --all-files --verbose --show-diff-on-failure

      - name: Run mixed-line-ending hook
        run: pre-commit run mixed-line-ending --all-files --verbose --show-diff-on-failure

      - name: Verify clean working tree after file hygiene hooks
        run: git diff --exit-code

  # ---------------------------------------------------------------------------
  # Hook 2: cargo-fmt-fix & cargo-fmt-check
  # ---------------------------------------------------------------------------
  hook-cargo-fmt:
    name: "Hook [2/8]: cargo-fmt-fix & cargo-fmt-check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Install Rust stable toolchain with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run cargo-fmt-fix pre-commit hook
        run: cargo fmt

      - name: Run cargo-fmt-check pre-commit hook
        run: cargo fmt -- --check

      - name: Verify clean working tree after formatting check
        run: git diff --exit-code

  # ---------------------------------------------------------------------------
  # Hook 3: cargo-build across Linux, macOS, and Windows
  # ---------------------------------------------------------------------------
  hook-cargo-build:
    name: "Hook [3/8]: cargo-build (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cdd-spec-conformance

      - name: Run cargo-build pre-commit hook
        run: cargo build --workspace --all-targets

      - name: Verify release binary compilation (--workspace --bins --release)
        run: cargo build --workspace --bins --release --locked

  # ---------------------------------------------------------------------------
  # Hook 4: cargo-clippy & rustdoc across Linux, macOS, and Windows
  # ---------------------------------------------------------------------------
  hook-cargo-clippy:
    name: "Hook [4/8]: cargo-clippy & rustdoc (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Install Rust stable toolchain with clippy and rust-docs
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rust-docs

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cdd-spec-conformance

      - name: Run cargo-clippy pre-commit hook
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify rustdoc builds with zero warnings (including private items)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items

  # ---------------------------------------------------------------------------
  # Hook 5: cargo-test across Linux, macOS, and Windows
  # ---------------------------------------------------------------------------
  hook-cargo-test:
    name: "Hook [5/8]: cargo-test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Checkout cdd-c
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-c
          path: cdd-c

      - name: Checkout cdd-cpp
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-cpp
          path: cdd-cpp

      - name: Checkout cdd-csharp
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-csharp
          path: cdd-csharp

      - name: Checkout cdd-go
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-go
          path: cdd-go

      - name: Checkout cdd-java
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-java
          path: cdd-java

      - name: Checkout cdd-kotlin
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-kotlin
          path: cdd-kotlin

      - name: Checkout cdd-php
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-php
          path: cdd-php

      - name: Checkout cdd-python-all
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-python-all
          path: cdd-python-all

      - name: Checkout cdd-ruby
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-ruby
          path: cdd-ruby

      - name: Checkout cdd-rust
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-rust
          path: cdd-rust

      - name: Checkout cdd-sh
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-sh
          path: cdd-sh

      - name: Checkout cdd-swift
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-swift
          path: cdd-swift

      - name: Checkout cdd-ts
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-ts
          path: cdd-ts

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cdd-spec-conformance

      - name: Run cargo-test pre-commit hook
        run: cargo test --workspace --all-targets

      - name: Run workspace documentation tests
        run: cargo test --workspace --doc

  # ---------------------------------------------------------------------------
  # Hook 6: update-coverage (100% doc coverage & 100% test coverage badges)
  # ---------------------------------------------------------------------------
  hook-update-coverage:
    name: "Hook [6/8]: update-coverage (100% Doc & Test Coverage)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Checkout cdd-c
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-c
          path: cdd-c

      - name: Checkout cdd-cpp
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-cpp
          path: cdd-cpp

      - name: Checkout cdd-csharp
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-csharp
          path: cdd-csharp

      - name: Checkout cdd-go
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-go
          path: cdd-go

      - name: Checkout cdd-java
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-java
          path: cdd-java

      - name: Checkout cdd-kotlin
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-kotlin
          path: cdd-kotlin

      - name: Checkout cdd-php
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-php
          path: cdd-php

      - name: Checkout cdd-python-all
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-python-all
          path: cdd-python-all

      - name: Checkout cdd-ruby
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-ruby
          path: cdd-ruby

      - name: Checkout cdd-rust
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-rust
          path: cdd-rust

      - name: Checkout cdd-sh
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-sh
          path: cdd-sh

      - name: Checkout cdd-swift
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-swift
          path: cdd-swift

      - name: Checkout cdd-ts
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-ts
          path: cdd-ts

      - name: Install Rust nightly toolchain for rustdoc coverage
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview, rust-docs

      - name: Install Rust stable toolchain with llvm-tools-preview
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, rust-docs

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cdd-spec-conformance

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run update-coverage pre-commit hook
        run: python3 scripts/update_coverage.py

      - name: Assert 100.00% doc and test coverage badges in README.md
        run: |
          grep -q "doc_coverage-100.00%25-brightgreen.svg" README.md
          grep -q "test_coverage-100.00%25-brightgreen.svg" README.md

      - name: Verify README.md badges are clean and unmodified
        run: git diff --exit-code README.md

  # ---------------------------------------------------------------------------
  # Hook 7: cdd-conformance-check across Linux, macOS, and Windows
  # ---------------------------------------------------------------------------
  hook-cdd-conformance-check:
    name: "Hook [7/8]: cdd-conformance-check (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cdd-spec-conformance

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify self-conformance script idempotency
        run: |
          python3 scripts/update_self_conformance.py
          git diff --exit-code

      - name: Run cdd-conformance-check pre-commit hook
        run: cargo run -- check --path .

      - name: Run strict-schema conformance audit and reports
        run: |
          cargo run -- check --path . --strict-schema --diff
          cargo run -- report --path .
          cargo run -- report --path . --json
          cargo run -- report --path . --markdown
          cargo run -- inspect-source --path src --require-docs

  # ---------------------------------------------------------------------------
  # Hook 8: update-readme-matrix (13-Repo Ecosystem Matrix)
  # ---------------------------------------------------------------------------
  hook-update-readme-matrix:
    name: "Hook [8/8]: update-readme-matrix"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Checkout cdd-c
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-c
          path: cdd-c

      - name: Checkout cdd-cpp
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-cpp
          path: cdd-cpp

      - name: Checkout cdd-csharp
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-csharp
          path: cdd-csharp

      - name: Checkout cdd-go
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-go
          path: cdd-go

      - name: Checkout cdd-java
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-java
          path: cdd-java

      - name: Checkout cdd-kotlin
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-kotlin
          path: cdd-kotlin

      - name: Checkout cdd-php
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-php
          path: cdd-php

      - name: Checkout cdd-python-all
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-python-all
          path: cdd-python-all

      - name: Checkout cdd-ruby
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-ruby
          path: cdd-ruby

      - name: Checkout cdd-rust
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-rust
          path: cdd-rust

      - name: Checkout cdd-sh
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-sh
          path: cdd-sh

      - name: Checkout cdd-swift
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-swift
          path: cdd-swift

      - name: Checkout cdd-ts
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-ts
          path: cdd-ts

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cdd-spec-conformance

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run update-readme-matrix hook with all 13 sibling repositories
        run: |
          python3 scripts/update_readme_matrix.py
          git diff --exit-code README.md

  # ---------------------------------------------------------------------------
  # Exported .pre-commit-hooks.yaml Verification (pre-commit try-repo)
  # ---------------------------------------------------------------------------
  exported-pre-commit-hooks:
    name: "Exported .pre-commit-hooks.yaml Suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Checkout cdd-c
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-c
          path: cdd-c

      - name: Checkout cdd-cpp
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-cpp
          path: cdd-cpp

      - name: Checkout cdd-csharp
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-csharp
          path: cdd-csharp

      - name: Checkout cdd-go
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-go
          path: cdd-go

      - name: Checkout cdd-java
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-java
          path: cdd-java

      - name: Checkout cdd-kotlin
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-kotlin
          path: cdd-kotlin

      - name: Checkout cdd-php
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-php
          path: cdd-php

      - name: Checkout cdd-python-all
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-python-all
          path: cdd-python-all

      - name: Checkout cdd-ruby
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-ruby
          path: cdd-ruby

      - name: Checkout cdd-rust
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-rust
          path: cdd-rust

      - name: Checkout cdd-sh
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-sh
          path: cdd-sh

      - name: Checkout cdd-swift
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-swift
          path: cdd-swift

      - name: Checkout cdd-ts
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-ts
          path: cdd-ts

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cdd-spec-conformance

      - name: Set up Python 3 and pre-commit
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit framework
        run: python3 -m pip install --upgrade pip pre-commit

      - name: Test exported hook cdd-conformance-check
        run: pre-commit try-repo . cdd-conformance-check --all-files --verbose

      - name: Test exported hook cdd-conformance-claims
        run: pre-commit try-repo . cdd-conformance-claims --all-files --verbose

      - name: Test exported hook cdd-conformance-matrix
        run: pre-commit try-repo . cdd-conformance-matrix --all-files --verbose

      - name: Verify clean working tree after exported hooks
        run: git diff --exit-code

  # ---------------------------------------------------------------------------
  # Full .pre-commit-config.yaml Pipeline Execution
  # ---------------------------------------------------------------------------
  pre-commit-all:
    name: "Full .pre-commit-config.yaml Suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Checkout cdd-c
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-c
          path: cdd-c

      - name: Checkout cdd-cpp
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-cpp
          path: cdd-cpp

      - name: Checkout cdd-csharp
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-csharp
          path: cdd-csharp

      - name: Checkout cdd-go
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-go
          path: cdd-go

      - name: Checkout cdd-java
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-java
          path: cdd-java

      - name: Checkout cdd-kotlin
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-kotlin
          path: cdd-kotlin

      - name: Checkout cdd-php
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-php
          path: cdd-php

      - name: Checkout cdd-python-all
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-python-all
          path: cdd-python-all

      - name: Checkout cdd-ruby
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-ruby
          path: cdd-ruby

      - name: Checkout cdd-rust
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-rust
          path: cdd-rust

      - name: Checkout cdd-sh
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-sh
          path: cdd-sh

      - name: Checkout cdd-swift
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-swift
          path: cdd-swift

      - name: Checkout cdd-ts
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-ts
          path: cdd-ts

      - name: Install Rust nightly toolchain for rustdoc coverage
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview, rust-docs

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview, rust-docs

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cdd-spec-conformance

      - name: Set up Python 3 and pre-commit
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit framework
        run: python3 -m pip install --upgrade pip pre-commit

      - name: Execute all hooks in .pre-commit-config.yaml
        run: pre-commit run --all-files --verbose --show-diff-on-failure

      - name: Verify working tree is completely clean
        run: git diff --exit-code

  # ---------------------------------------------------------------------------
  # Cross-Architecture & Multi-OS Target Compilation Matrix
  # ---------------------------------------------------------------------------
  cross-target-matrix:
    name: "Cross-Target Check (${{ matrix.target }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - riscv64gc-unknown-linux-gnu
          - x86_64-unknown-freebsd
          - x86_64-unknown-illumos
          - x86_64-pc-windows-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Install Rust stable toolchain with target ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cdd-spec-conformance
          key: check-${{ matrix.target }}

      - name: Verify workspace check for ${{ matrix.target }}
        run: cargo check --workspace --bins --lib --target ${{ matrix.target }} --locked

  # ---------------------------------------------------------------------------
  # Build OS + Arch Release Binaries (on `v*` Tag Push)
  # ---------------------------------------------------------------------------
  build-release-binaries:
    name: "Build Release (${{ matrix.os_name }}-${{ matrix.arch_name }} / ${{ matrix.target }})"
    needs:
      - hook-pre-commit-file-checks
      - hook-cargo-fmt
      - hook-cargo-build
      - hook-cargo-clippy
      - hook-cargo-test
      - hook-update-coverage
      - hook-cdd-conformance-check
      - hook-update-readme-matrix
      - exported-pre-commit-hooks
      - pre-commit-all
      - cross-target-matrix
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch_name: x86_64-gnu
            archive_ext: tar.gz
            bin_ext: ""

          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            os_name: linux
            arch_name: x86_64-musl
            archive_ext: tar.gz
            bin_ext: ""

          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch_name: aarch64-gnu
            archive_ext: tar.gz
            bin_ext: ""

          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            os_name: linux
            arch_name: aarch64-musl
            archive_ext: tar.gz
            bin_ext: ""

          - runner: macos-latest
            target: x86_64-apple-darwin
            os_name: macos
            arch_name: x86_64
            archive_ext: tar.gz
            bin_ext: ""

          - runner: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            arch_name: aarch64
            archive_ext: tar.gz
            bin_ext: ""

          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch_name: x86_64
            archive_ext: zip
            bin_ext: ".exe"

          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            os_name: windows
            arch_name: aarch64
            archive_ext: zip
            bin_ext: ".exe"

    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Resolve release version tag
        id: version
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up cross-compilation C linker toolchain (Linux targets)
        if: ${{ matrix.os_name == 'linux' }}
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cdd-spec-conformance
          key: release-${{ matrix.target }}

      - name: Build release binary with Cargo
        run: cargo build --workspace --bins --release --locked --target ${{ matrix.target }}

      - name: Package OS+arch release archive and standalone binary (Unix)
        if: ${{ matrix.archive_ext == 'tar.gz' }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          OS_NAME="${{ matrix.os_name }}"
          ARCH_NAME="${{ matrix.arch_name }}"
          TARGET="${{ matrix.target }}"
          BIN_EXT="${{ matrix.bin_ext }}"

          PKG_BASENAME="cdd-conformance-${TAG}-${OS_NAME}-${ARCH_NAME}"
          STAGE_DIR="dist/${PKG_BASENAME}"
          mkdir -p "${STAGE_DIR}"

          REL_DIR="target/${TARGET}/release"
          cp "${REL_DIR}/cdd-conformance${BIN_EXT}" "${STAGE_DIR}/cdd-conformance${BIN_EXT}"
          chmod +x "${STAGE_DIR}/cdd-conformance${BIN_EXT}"

          cp README.md USAGE.md LICENSE-APACHE LICENSE-MIT "${STAGE_DIR}/"

          tar -C dist -czf "dist/${PKG_BASENAME}.tar.gz" "${PKG_BASENAME}"
          cp "${REL_DIR}/cdd-conformance${BIN_EXT}" "dist/cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}"
          chmod +x "dist/cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}"

          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${PKG_BASENAME}.tar.gz" > "${PKG_BASENAME}.tar.gz.sha256"
              sha256sum "cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}" > "cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}.sha256"
            else
              shasum -a 256 "${PKG_BASENAME}.tar.gz" > "${PKG_BASENAME}.tar.gz.sha256"
              shasum -a 256 "cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}" > "cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}.sha256"
            fi
          )
          rm -rf "${STAGE_DIR}"

      - name: Package OS+arch release archive and standalone binary (Windows)
        if: ${{ matrix.archive_ext == 'zip' }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          OS_NAME="${{ matrix.os_name }}"
          ARCH_NAME="${{ matrix.arch_name }}"
          TARGET="${{ matrix.target }}"
          BIN_EXT="${{ matrix.bin_ext }}"

          PKG_BASENAME="cdd-conformance-${TAG}-${OS_NAME}-${ARCH_NAME}"
          STAGE_DIR="dist/${PKG_BASENAME}"
          mkdir -p "${STAGE_DIR}"

          REL_DIR="target/${TARGET}/release"
          cp "${REL_DIR}/cdd-conformance${BIN_EXT}" "${STAGE_DIR}/cdd-conformance${BIN_EXT}"
          cp README.md USAGE.md LICENSE-APACHE LICENSE-MIT "${STAGE_DIR}/"

          powershell -NoProfile -Command "Compress-Archive -Path 'dist/${PKG_BASENAME}' -DestinationPath 'dist/${PKG_BASENAME}.zip' -Force"
          cp "${REL_DIR}/cdd-conformance${BIN_EXT}" "dist/cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}"

          (
            cd dist
            sha256sum "${PKG_BASENAME}.zip" > "${PKG_BASENAME}.zip.sha256"
            sha256sum "cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}" > "cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}.sha256"
          )
          rm -rf "${STAGE_DIR}"

      - name: Upload OS+arch release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os_name }}-${{ matrix.arch_name }}
          path: cdd-spec-conformance/dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish GitHub Release on `v*` Tag Push
  # ---------------------------------------------------------------------------
  publish-github-release:
    name: "Publish GitHub Release"
    needs: build-release-binaries
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Download all OS+arch artifacts
        uses: actions/download-artifact@v8
        with:
          path: cdd-spec-conformance/release-assets
          merge-multiple: true

      - name: Generate consolidated SHA256SUMS.txt
        run: |
          cd release-assets
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release with OS+arch binaries
        uses: softprops/action-gh-release@v3
        with:
          name: "cdd-conformance ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            cdd-spec-conformance/release-assets/*.tar.gz
            cdd-spec-conformance/release-assets/*.zip
            cdd-spec-conformance/release-assets/cdd-conformance-*
            cdd-spec-conformance/release-assets/*.sha256
            cdd-spec-conformance/release-assets/SHA256SUMS.txt
