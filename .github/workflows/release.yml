name: Release OS+Arch Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g., v0.1.0) for manual workflow dispatch"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    working-directory: cdd-spec-conformance

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Pre-Release Quality Gate (All Pre-commit Hooks)
  # ---------------------------------------------------------------------------
  pre-release-checks:
    name: "Pre-Release Quality Gate (Pre-commit Suite)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Checkout cdd-c
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-c
          path: cdd-c

      - name: Checkout cdd-cpp
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-cpp
          path: cdd-cpp

      - name: Checkout cdd-csharp
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-csharp
          path: cdd-csharp

      - name: Checkout cdd-go
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-go
          path: cdd-go

      - name: Checkout cdd-java
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-java
          path: cdd-java

      - name: Checkout cdd-kotlin
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-kotlin
          path: cdd-kotlin

      - name: Checkout cdd-php
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-php
          path: cdd-php

      - name: Checkout cdd-python-all
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-python-all
          path: cdd-python-all

      - name: Checkout cdd-ruby
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-ruby
          path: cdd-ruby

      - name: Checkout cdd-rust
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-rust
          path: cdd-rust

      - name: Checkout cdd-sh
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-sh
          path: cdd-sh

      - name: Checkout cdd-swift
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-swift
          path: cdd-swift

      - name: Checkout cdd-ts
        uses: actions/checkout@v7
        with:
          repository: offscale/cdd-ts
          path: cdd-ts

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-docs

      - name: Install Rust nightly toolchain with llvm-tools-preview and rust-docs
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview, rust-docs

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cdd-spec-conformance

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit framework
        run: python3 -m pip install --upgrade pip pre-commit

      - name: Run complete pre-commit verification pipeline
        run: pre-commit run --all-files --verbose --show-diff-on-failure

      - name: Verify working tree is completely clean
        run: git diff --exit-code

  # ---------------------------------------------------------------------------
  # Stage 2: Build OS + Arch Release Binaries
  # ---------------------------------------------------------------------------
  build-release-binaries:
    name: "Build (${{ matrix.os_name }}-${{ matrix.arch_name }} / ${{ matrix.target }})"
    needs: pre-release-checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch_name: x86_64-gnu
            archive_ext: tar.gz
            bin_ext: ""

          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            os_name: linux
            arch_name: x86_64-musl
            archive_ext: tar.gz
            bin_ext: ""

          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch_name: aarch64-gnu
            archive_ext: tar.gz
            bin_ext: ""

          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            os_name: linux
            arch_name: aarch64-musl
            archive_ext: tar.gz
            bin_ext: ""

          - runner: macos-latest
            target: x86_64-apple-darwin
            os_name: macos
            arch_name: x86_64
            archive_ext: tar.gz
            bin_ext: ""

          - runner: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            arch_name: aarch64
            archive_ext: tar.gz
            bin_ext: ""

          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch_name: x86_64
            archive_ext: zip
            bin_ext: ".exe"

          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            os_name: windows
            arch_name: aarch64
            archive_ext: zip
            bin_ext: ".exe"

    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Resolve release version tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v0.1.0"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up cross-compilation C linker toolchain (Linux targets)
        if: ${{ matrix.os_name == 'linux' }}
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cdd-spec-conformance
          key: release-${{ matrix.target }}

      - name: Build release binary with Cargo
        run: cargo build --workspace --bins --release --locked --target ${{ matrix.target }}

      - name: Package OS+arch release archive and standalone binary (Unix)
        if: ${{ matrix.archive_ext == 'tar.gz' }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          OS_NAME="${{ matrix.os_name }}"
          ARCH_NAME="${{ matrix.arch_name }}"
          TARGET="${{ matrix.target }}"
          BIN_EXT="${{ matrix.bin_ext }}"

          PKG_BASENAME="cdd-conformance-${TAG}-${OS_NAME}-${ARCH_NAME}"
          STAGE_DIR="dist/${PKG_BASENAME}"
          mkdir -p "${STAGE_DIR}"

          REL_DIR="target/${TARGET}/release"
          cp "${REL_DIR}/cdd-conformance${BIN_EXT}" "${STAGE_DIR}/cdd-conformance${BIN_EXT}"
          chmod +x "${STAGE_DIR}/cdd-conformance${BIN_EXT}"

          cp README.md USAGE.md LICENSE-APACHE LICENSE-MIT "${STAGE_DIR}/"

          tar -C dist -czf "dist/${PKG_BASENAME}.tar.gz" "${PKG_BASENAME}"
          cp "${REL_DIR}/cdd-conformance${BIN_EXT}" "dist/cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}"
          chmod +x "dist/cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}"

          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${PKG_BASENAME}.tar.gz" > "${PKG_BASENAME}.tar.gz.sha256"
              sha256sum "cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}" > "cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}.sha256"
            else
              shasum -a 256 "${PKG_BASENAME}.tar.gz" > "${PKG_BASENAME}.tar.gz.sha256"
              shasum -a 256 "cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}" > "cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}.sha256"
            fi
          )
          rm -rf "${STAGE_DIR}"

      - name: Package OS+arch release archive and standalone binary (Windows)
        if: ${{ matrix.archive_ext == 'zip' }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          OS_NAME="${{ matrix.os_name }}"
          ARCH_NAME="${{ matrix.arch_name }}"
          TARGET="${{ matrix.target }}"
          BIN_EXT="${{ matrix.bin_ext }}"

          PKG_BASENAME="cdd-conformance-${TAG}-${OS_NAME}-${ARCH_NAME}"
          STAGE_DIR="dist/${PKG_BASENAME}"
          mkdir -p "${STAGE_DIR}"

          REL_DIR="target/${TARGET}/release"
          cp "${REL_DIR}/cdd-conformance${BIN_EXT}" "${STAGE_DIR}/cdd-conformance${BIN_EXT}"
          cp README.md USAGE.md LICENSE-APACHE LICENSE-MIT "${STAGE_DIR}/"

          powershell -NoProfile -Command "Compress-Archive -Path 'dist/${PKG_BASENAME}' -DestinationPath 'dist/${PKG_BASENAME}.zip' -Force"
          cp "${REL_DIR}/cdd-conformance${BIN_EXT}" "dist/cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}"

          (
            cd dist
            sha256sum "${PKG_BASENAME}.zip" > "${PKG_BASENAME}.zip.sha256"
            sha256sum "cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}" > "cdd-conformance-${OS_NAME}-${ARCH_NAME}${BIN_EXT}.sha256"
          )
          rm -rf "${STAGE_DIR}"

      - name: Upload OS+arch release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os_name }}-${{ matrix.arch_name }}
          path: cdd-spec-conformance/dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Stage 3: Publish GitHub Release on `v*` Tag Push
  # ---------------------------------------------------------------------------
  publish-github-release:
    name: "Publish GitHub Release"
    needs: build-release-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cdd-spec-conformance
        uses: actions/checkout@v7
        with:
          path: cdd-spec-conformance

      - name: Download all OS+arch artifacts
        uses: actions/download-artifact@v8
        with:
          path: cdd-spec-conformance/release-assets
          merge-multiple: true

      - name: Generate consolidated SHA256SUMS.txt
        run: |
          cd release-assets
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release with OS+arch binaries
        uses: softprops/action-gh-release@v3
        with:
          name: "cdd-conformance ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            cdd-spec-conformance/release-assets/*.tar.gz
            cdd-spec-conformance/release-assets/*.zip
            cdd-spec-conformance/release-assets/cdd-conformance-*
            cdd-spec-conformance/release-assets/*.sha256
            cdd-spec-conformance/release-assets/SHA256SUMS.txt
