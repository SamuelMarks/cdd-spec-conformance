[package]
name = "cdd-conformance"
version = "0.1.0"
edition = "2021"
authors = ["Samuel Marks <807580+SamuelMarks@users.noreply.github.com>"]
description = "Centralised CDD specification conformance verification tool, pre-commit hook, and MCP server."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/SamuelMarks/cdd-spec-conformance"
readme = "README.md"
keywords = ["cdd", "openapi", "conformance", "mcp", "pre-commit"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "cdd_conformance"
path = "src/lib.rs"

[[bin]]
name = "cdd-conformance"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
colored = "3.1"
comfy-table = "8.0"
derive_more = { version = "2.1", features = ["display", "error"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
