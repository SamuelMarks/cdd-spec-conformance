[package]
name = "cdd-conformance"
version = "0.0.1"
edition = "2021"
authors = ["Samuel Marks <807580+SamuelMarks@users.noreply.github.com>"]
description = "Centralised CDD specification conformance verification tool, pre-commit hook, and MCP server."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/SamuelMarks/cdd-spec-conformance"
readme = "README.md"
keywords = ["cdd", "openapi", "conformance", "mcp", "pre-commit"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "cdd_conformance"
path = "src/lib.rs"

[[bin]]
name = "cdd-conformance"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
colored = { version = "3.1", default-features = false }
comfy-table = { version = "~7.1", default-features = false, features = ["tty"] }
derive_more = { version = "2.1", default-features = false, features = ["std", "display", "error"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serde_yaml = { version = "0.9", default-features = false }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "net", "time"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
missing_docs_in_private_items = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
