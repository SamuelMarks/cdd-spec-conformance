- id: cdd-conformance-check
  name: Confirm CDD Specification Conformance
  description: Validates checklists and verifies implemented standards for the repository
  entry: cdd-conformance check
  language: rust
  files: ^(conformance/|compliance-|openapi-|swagger-|arazzo-|mcp-|mock-server|COMPLIANCE\.md|\.cdd-conformance\.ya?ml)
  pass_filenames: false

- id: cdd-conformance-claims
  name: Verify COMPLIANCE.md Claims
  description: Verifies documented claims in COMPLIANCE.md against checklist ground truth
  entry: cdd-conformance check --claims-only
  language: rust
  files: ^(COMPLIANCE\.md|conformance/|arazzo-)
  pass_filenames: false

- id: cdd-conformance-matrix
  name: Update Ecosystem Conformance Matrix in README.md
  description: Scans ecosystem repositories and updates the conformance matrix table in README.md
  entry: python3 scripts/update_readme_matrix.py
  language: system
  files: ^(README\.md|conformance/|compliance-|openapi-|swagger-|arazzo-|mcp-|mock-server)
  pass_filenames: false
